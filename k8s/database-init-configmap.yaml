apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS produtos (
        id SERIAL PRIMARY KEY,
        nome VARCHAR(100) NOT NULL,
        preco NUMERIC(10,2) NOT NULL CHECK (preco > 0),
        estoque INTEGER NOT NULL DEFAULT 0 CHECK (estoque >= 0),
        estoque_minimo INTEGER NOT NULL DEFAULT 0 CHECK (estoque_minimo >= 0)
    );
    CREATE TABLE IF NOT EXISTS movimentacoes (
        id SERIAL PRIMARY KEY,
        produto_id INTEGER NOT NULL REFERENCES produtos(id),
        tipo VARCHAR(10) NOT NULL CHECK (tipo IN ('ENTRADA', 'SAIDA')),
        quantidade INTEGER NOT NULL CHECK (quantidade > 0),
        estoque_anterior INTEGER NOT NULL CHECK (estoque_anterior >= 0),
        estoque_posterior INTEGER NOT NULL CHECK (estoque_posterior >= 0),
        motivo VARCHAR(200),
        pedido_id VARCHAR(50),
        criado_em TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO produtos (nome, preco, estoque, estoque_minimo)
    SELECT 'Coxinha', 5.00, 20, 5
    WHERE NOT EXISTS (SELECT 1 FROM produtos);
